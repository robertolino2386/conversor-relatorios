<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversor de Faturas</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --azul-claro: #69A0D3;
      --azul-escuro: #00285C;
      --dourado: #D6AE00;
      --branco: #ffffff;
      --fundo: #f5f7fb;
      --texto: #1b2b41;
      --texto-suave: #667085;
      --borda: #dbe4f0;
      --sombra: rgba(0, 40, 92, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--fundo);
      color: var(--texto);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .container {
      width: 100%;
      max-width: 760px;
    }

    .card {
      background: var(--branco);
      border: 1px solid var(--borda);
      border-radius: 28px;
      box-shadow: 0 12px 40px var(--sombra);
      overflow: hidden;
    }

    .topo {
      padding: 38px 38px 24px;
      border-bottom: 1px solid var(--borda);
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
    }

    .selo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid #d8e3f0;
      border-radius: 999px;
      color: var(--azul-escuro);
      font-size: 13px;
      margin-bottom: 18px;
      background: #f8fbff;
      font-weight: 600;
    }

    .ponto {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--dourado);
    }

    h1 {
      font-size: clamp(24px, 4vw, 36px);
      line-height: 1.08;
      margin-bottom: 12px;
      letter-spacing: -1px;
      color: var(--azul-escuro);
    }

    .subtitulo {
      color: var(--texto-suave);
      font-size: 16px;
      line-height: 1.6;
      max-width: 620px;
    }

    .conteudo {
      padding: 34px;
    }

    .upload-area {
      border: 1.5px dashed #c7d8ea;
      background: #fafcff;
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      transition: 0.25s ease;
    }

    .upload-area:hover {
      border-color: var(--azul-claro);
      background: #f5faff;
    }

    .icone {
      width: 74px;
      height: 74px;
      margin: 0 auto 18px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--azul-claro), var(--azul-escuro));
      color: var(--branco);
      font-size: 34px;
      box-shadow: 0 10px 24px rgba(105, 160, 211, 0.22);
    }

    .upload-area h2 {
      font-size: 24px;
      color: var(--azul-escuro);
      margin-bottom: 8px;
    }

    .upload-area p {
      color: var(--texto-suave);
      font-size: 15px;
      margin-bottom: 28px;
    }

    input[type="file"] {
      display: none;
    }

    .botoes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 8px;
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 14px 24px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: 0.22s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 170px;
    }

    .btn-upload {
      background: var(--azul-claro);
      color: var(--branco);
    }

    .btn-converter {
      background: var(--dourado);
      color: #1d1d1d;
    }

    .btn-baixar {
      background: var(--azul-escuro);
      color: var(--branco);
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.03);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .arquivo {
      margin-top: 20px;
      color: var(--azul-escuro);
      font-size: 14px;
      font-weight: 600;
      min-height: 20px;
    }

    .mensagem {
      margin-top: 24px;
      padding: 16px 18px;
      border-radius: 18px;
      display: none;
      line-height: 1.5;
      font-size: 14px;
    }

    .mensagem.sucesso {
      display: block;
      background: #eef8ef;
      border: 1px solid #b8e0bc;
      color: #206737;
    }

    .mensagem.erro {
      display: block;
      background: #fff1f1;
      border: 1px solid #f2b4b4;
      color: #9f2d2d;
    }

    .rodape {
      padding: 18px 34px 30px;
      color: #8a94a6;
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 560px) {
      .topo, .conteudo {
        padding: 26px 20px;
      }

      .upload-area {
        padding: 28px 18px;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="topo">
        <div class="selo"><span class="ponto"></span> Conversor de Relatórios</div>
        <h1>Atualize seu relatório em poucos cliques</h1>
        <p class="subtitulo">Faça o upload da planilha recebida do Benner, converta o arquivo e baixe o Excel atualizado para uso.</p>
      </div>

      <div class="conteudo">
        <div class="upload-area">
          <div class="icone">↥</div>
          <h2>Enviar arquivo</h2>
          <p>Selecione a planilha de faturas para iniciar a conversão.</p>

          <input id="arquivoInput" type="file" accept=".xls,.xlsx,.xlsm" />

          <div class="botoes">
            <label class="btn btn-upload" for="arquivoInput">Escolher arquivo</label>
            <button id="converterBtn" class="btn btn-converter" disabled>Converter</button>
            <button id="baixarBtn" class="btn btn-baixar" disabled>Baixar Excel</button>
          </div>

          <div id="arquivoNome" class="arquivo"></div>
          <div id="mensagem" class="mensagem"></div>
        </div>
      </div>

      <div class="rodape">Desenvolvido por <strong><em>Roberto Lino</em></strong></div>
    </section>
  </main>

  <script>
    const arquivoInput = document.getElementById('arquivoInput');
    const converterBtn = document.getElementById('converterBtn');
    const baixarBtn = document.getElementById('baixarBtn');
    const arquivoNome = document.getElementById('arquivoNome');
    const mensagem = document.getElementById('mensagem');

    let arquivoSelecionado = null;
    let workbookConvertido = null;

    const colunasOriginais = [
      'Column1', 'Column2', 'Column3', 'Column4', 'Column5', 'Column6',
      'Column7', 'Column8', 'Column9', 'Column10', 'Column11', 'Column12',
      'Column13', 'Column14', 'Column15', 'Column16', 'Column17', 'Column18'
    ];

    const colunasFinais = [
      'Clientes', 'Fatura', 'Nr. AP', 'Vencimento', 'Prorrogado',
      'Dias', 'Emissão', 'Tipo D.', 'Moeda', 'Total Pagar'
    ];

    function mostrarMensagem(texto, tipo) {
      mensagem.textContent = texto;
      mensagem.className = `mensagem ${tipo}`;
    }

    function excelDateParaJS(valor) {
      if (valor === null || valor === undefined || valor === '') return '';
      if (valor instanceof Date) return valor;
      if (typeof valor === 'number') {
        const data = XLSX.SSF.parse_date_code(valor);
        if (!data) return valor;
        return new Date(data.y, data.m - 1, data.d);
      }
      if (typeof valor === 'string') {
        const texto = valor.trim();
        const partes = texto.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
        if (partes) {
          const dia = Number(partes[1]);
          const mes = Number(partes[2]) - 1;
          let ano = Number(partes[3]);
          if (ano < 100) ano += 2000;
          return new Date(ano, mes, dia);
        }
      }
      return valor;
    }

    function moedaParaNumero(valor) {
      if (valor === null || valor === undefined || valor === '') return null;
      if (typeof valor === 'number') return valor;
      const texto = String(valor)
        .replace(/R\$/g, '')
        .replace(/\s/g, '')
        .replace(/\./g, '')
        .replace(',', '.');
      const numero = Number(texto);
      return Number.isNaN(numero) ? valor : numero;
    }

    function limparFatura(valor) {
      if (valor === null || valor === undefined) return '';
      let texto = String(valor).replace(/-1/g, '').trim();
      const posicaoZero = texto.indexOf('0');
      if (posicaoZero >= 0) {
        texto = texto.slice(posicaoZero + 1);
      }
      return texto.trim();
    }

    function converterDados(linhas) {
      const linhasComColunas = linhas.map(linha => {
        const obj = {};
        colunasOriginais.forEach((coluna, indice) => {
          obj[coluna] = linha[indice] ?? null;
        });
        return obj;
      });

      const linhasFiltradas = linhasComColunas.filter(linha => {
        const valor = linha.Column1;
        return valor !== null &&
          valor !== undefined &&
          valor !== '' &&
          valor !== 'Copastur Viagens e Turismo Ltda' &&
          valor !== 'P.2006' &&
          valor !== 'Sistema Corporativo' &&
          valor !== 'Total do fornecedor';
      });

      if (linhasFiltradas.length === 0) return [];

      const cabecalhos = Object.values(linhasFiltradas[0]).map(valor => String(valor ?? '').trim());
      const dados = linhasFiltradas.slice(1).map(linha => {
        const valores = Object.values(linha);
        const obj = {};
        cabecalhos.forEach((cabecalho, indice) => {
          obj[cabecalho || `Column${indice + 1}`] = valores[indice] ?? null;
        });
        return obj;
      });

      let clienteAtual = null;

      const resultado = [];

      dados.forEach(linha => {
        if (linha['Cia.'] === 'Cia.') return;

        let cia = linha['Cia.'];
        if (String(cia).trim() === '1') cia = null;
        if (cia !== null && cia !== undefined && String(cia).trim() !== '') {
          clienteAtual = cia;
        }
        linha['Cia.'] = clienteAtual;

        if (linha['Docto'] === null || linha['Docto'] === undefined || String(linha['Docto']).trim() === '') return;

        const item = {
          'Clientes': linha['Cia.'] ?? '',
          'Fatura': limparFatura(linha['Docto']),
          'Nr. AP': linha['Nr. AP'] === '' || linha['Nr. AP'] === null || linha['Nr. AP'] === undefined ? null : Number(linha['Nr. AP']),
          'Vencimento': excelDateParaJS(linha['Vencimento']),
          'Prorrogado': excelDateParaJS(linha['Prorrogado']),
          'Dias': linha['Dias'] ?? '',
          'Emissão': excelDateParaJS(linha['Emissão']),
          'Tipo D.': linha['Tipo D.'] ?? '',
          'Moeda': linha['Moeda'] ?? '',
          'Total Pagar': moedaParaNumero(linha['Total Pagar'])
        };

        resultado.push(item);
      });

      return resultado;
    }

    arquivoInput.addEventListener('change', () => {
      arquivoSelecionado = arquivoInput.files[0];
      workbookConvertido = null;
      baixarBtn.disabled = true;

      if (arquivoSelecionado) {
        arquivoNome.textContent = arquivoSelecionado.name;
        converterBtn.disabled = false;
        mensagem.className = 'mensagem';
        mensagem.textContent = '';
      }
    });

    converterBtn.addEventListener('click', async () => {
      if (!arquivoSelecionado) return;

      try {
        const buffer = await arquivoSelecionado.arrayBuffer();
        const workbook = XLSX.read(buffer, { type: 'array', cellDates: true });
        const nomeAba = workbook.SheetNames.includes('Sheet1') ? 'Sheet1' : workbook.SheetNames[0];
        const worksheet = workbook.Sheets[nomeAba];
        const linhas = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: null, raw: true });

        const dadosConvertidos = converterDados(linhas);

        if (!dadosConvertidos.length) {
          mostrarMensagem('Não foi possível converter este arquivo. Verifique se a planilha selecionada é a planilha de faturas.', 'erro');
          baixarBtn.disabled = true;
          return;
        }

        const novaPlanilha = XLSX.utils.json_to_sheet(dadosConvertidos, { header: colunasFinais });

        const range = XLSX.utils.decode_range(novaPlanilha['!ref']);
        for (let linha = 1; linha <= range.e.r; linha++) {
          ['D', 'E', 'G'].forEach(coluna => {
            const celula = novaPlanilha[`${coluna}${linha + 1}`];
            if (celula && celula.v instanceof Date) {
              celula.t = 'd';
              celula.z = 'dd/mm/yyyy';
            }
          });
          const celulaValor = novaPlanilha[`J${linha + 1}`];
          if (celulaValor && typeof celulaValor.v === 'number') {
            celulaValor.t = 'n';
            celulaValor.z = 'R$ #,##0.00';
          }
        }

        novaPlanilha['!cols'] = [
          { wch: 46 }, { wch: 18 }, { wch: 12 }, { wch: 14 }, { wch: 14 },
          { wch: 10 }, { wch: 14 }, { wch: 12 }, { wch: 10 }, { wch: 16 }
        ];

        workbookConvertido = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbookConvertido, novaPlanilha, 'Faturas Convertidas');

        mostrarMensagem('Arquivo convertido com sucesso. Clique em Baixar Excel para salvar o relatório atualizado.', 'sucesso');
        baixarBtn.disabled = false;
      } catch (erro) {
        mostrarMensagem('Não foi possível converter este arquivo. Selecione a planilha correta e tente novamente.', 'erro');
        baixarBtn.disabled = true;
      }
    });

    baixarBtn.addEventListener('click', () => {
      if (!workbookConvertido) return;
      XLSX.writeFile(workbookConvertido, 'relatorio_convertido.xlsx');
    });
  </script>
</body>
</html>
